<div class="contenedor-fecha">
  
  <ion-datetime-button datetime="datetime"></ion-datetime-button>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime 
        id="datetime" 
        presentation="date" 
        (ionChange)="onFechaCambiada($event)">
      </ion-datetime>
    </ng-template>
  </ion-modal>

</div>
