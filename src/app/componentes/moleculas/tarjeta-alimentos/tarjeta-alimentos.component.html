<div class="contenedor-alimento">
  <img [src]="imagen" [alt]="nombre" class="imagen-alimento">
  
  <div class="overlay-datos">
    <div class="info">
      <span class="nombre">{{ nombre }}</span>
      <span class="calorias">{{ kcal }} kcal</span>
    </div>
    <ion-button fill="clear" (click)="onAdd.emit()" class="boton-add">
      <ion-icon slot="icon-only" name="add-circle" color="success"></ion-icon>
    </ion-button>
  </div>
  
</div>
