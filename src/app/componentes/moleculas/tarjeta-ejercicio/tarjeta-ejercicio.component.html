<ion-card class="ejercicio-card">
  <img [src]="ejercicio.imagen" (error)="ejercicio.imagen = 'assets/ejercicios/default.png'" />
  <ion-card-header>
    <ion-card-title>{{ ejercicio.nombre }}</ion-card-title>
    <ion-card-subtitle>{{ ejercicio.grupo }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p>{{ ejercicio.descripcion }}</p>
    <ion-button expand="block" fill="outline" (click)="emitirConfiguracion()">
      CONFIGURAR SERIES
    </ion-button>
  </ion-card-content>
</ion-card>
