<ion-list lines="full">
  <ion-list-header>
    <ion-label>Consumo del día</ion-label>
  </ion-list-header>

  <ion-item *ngIf="comidas.length === 0">
    <ion-label class="ion-text-center" color="medium">
      No has añadido alimentos hoy
    </ion-label>
  </ion-item>

  <ion-item *ngFor="let item of comidas">
    <ion-thumbnail slot="start">
      <img [src]="item.imagen" />
    </ion-thumbnail>
    
    <ion-label>
      <h2 style="font-weight: bold;">{{ item.nombre }}</h2>
      <p>{{ item.kcal }} kcal | P: {{ item.protes }}g | C: {{ item.carbos }}g</p>
    </ion-label>

    <ion-button slot="end" fill="clear" color="danger" (click)="onEliminar.emit(item.id)">
      <ion-icon slot="icon-only" name="trash"></ion-icon>
    </ion-button>
  </ion-item>
</ion-list>
