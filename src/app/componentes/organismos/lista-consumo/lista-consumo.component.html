<ion-list>
  <ion-list-header>
    <ion-label>Consumo del día</ion-label>
  </ion-list-header>

  <ion-item *ngIf="comidas.length === 0">
    <ion-label class="ion-text-center" color="medium">
      No has añadido alimentos hoy
    </ion-label>
  </ion-item>

  <ion-item-sliding *ngFor="let item of comidas">
    <ion-item>
      <ion-thumbnail slot="start">
        <img [src]="item.imagen" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.nombre }}</h2>
        <p>{{ item.kcal }} kcal | P: {{ item.protes }}g | C: {{ item.carbos }}g</p>
      </ion-label>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option color="danger" (click)="onEliminar.emit(item.id)">
        <ion-icon slot="icon-only" name="trash"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>
