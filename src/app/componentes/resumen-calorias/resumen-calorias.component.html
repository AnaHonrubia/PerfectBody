<ion-card>
  <ion-card-header>
    <ion-card-title>Resumen Diario</ion-card-title>
    <ion-card-subtitle>Calorías: {{ consumidas }} / {{ objetivo }} kcal</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <ion-progress-bar [value]="porcentaje" color="success"></ion-progress-bar>

    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <small>Prot: {{ proteinas }}g</small>
          <ion-progress-bar value="0.6" color="primary"></ion-progress-bar>
        </ion-col>
        <ion-col size="4">
          <small>Gras: {{ grasas }}g</small>
          <ion-progress-bar value="0.4" color="warning"></ion-progress-bar>
        </ion-col>
        <ion-col size="4">
          <small>HC: {{ carbohidratos }}g</small>
          <ion-progress-bar value="0.7" color="tertiary"></ion-progress-bar>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
