<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-title>Entrenamiento</ion-title>
    <ion-buttons slot="end">
      <app-boton-oscuro></app-boton-oscuro>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment (ionChange)="cambiarGrupo($event)" [value]="grupoSeleccionado" scrollable>
      <ion-segment-button value="Pecho">
        <ion-label>Pecho</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Espalda">
        <ion-label>Espalda</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Pierna">
        <ion-label>Pierna</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Hombros">
        <ion-label>Hombros</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Brazos">
        <ion-label>Brazos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="Core">
        <ion-label>Core</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let ejercicio of ejerciciosFiltrados">
        <ion-card class="ejercicio-card">
          <img [src]="ejercicio.imagen" />
          <ion-card-header>
            <ion-card-title>{{ ejercicio.nombre }}</ion-card-title>
            <ion-card-subtitle>{{ ejercicio.grupo }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{ ejercicio.descripcion }}</p>
            <ion-button expand="block" fill="outline" (click)="abrirModalEntreno(ejercicio)">
              CONFIGURAR SERIES
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<ion-modal #modal [isOpen]="isModalOpen">
  <ng-template>
    <ion-header>
      <ion-toolbar color="success">
        <ion-title>{{ ejercicioSeleccionado?.nombre }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarModal()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <div class="header-modal">
        <h3>Registro de hoy</h3>
        <p>Anota el peso y las repeticiones logradas.</p>
      </div>

      <ion-list lines="none">
        <ion-item *ngFor="let serie of seriesTemporales; let i = index" class="serie-item">
          <ion-label slot="start" class="numero-serie">{{ i + 1 }}</ion-label>
          
          <ion-input type="number" placeholder="Peso (kg)" [(ngModel)]="serie.peso" class="input-entreno"></ion-input>
          <ion-input type="number" placeholder="Repes" [(ngModel)]="serie.repeticiones" class="input-entreno"></ion-input>
          
          <ion-button slot="end" fill="clear" color="danger" (click)="quitarSerie(i)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>

      <ion-button expand="block" fill="outline" color="medium" (click)="agregarSerie()" class="ion-margin-bottom">
        <ion-icon name="add-outline" slot="start"></ion-icon>
        Añadir Serie
      </ion-button>

      <ion-button expand="block" color="success" (click)="guardarEntreno()">
        Finalizar Ejercicio
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
