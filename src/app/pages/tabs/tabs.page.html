<!-- Contenedor general que gestiona la navegación por pestañas (Tabs) de la app -->
<ion-tabs>
  
  <!-- Barra de menú configurada para fijarse en la parte inferior de la pantalla (slot="bottom") -->
  <ion-tab-bar slot="bottom">

    <!-- Pestaña 1: Redirige a la sección de Nutrición (contador de calorías y macros) -->
    <ion-tab-button tab="nutricion">
      <ion-icon name="restaurant-outline"></ion-icon>
      <ion-label>Nutrición</ion-label>
    </ion-tab-button>

    <!-- Pestaña 2: Redirige al módulo de Entrenamiento (configuración de series y ejercicios) -->
    <ion-tab-button tab="entrenamiento">
      <ion-icon name="barbell-outline"></ion-icon>
      <ion-label>Entreno</ion-label>
    </ion-tab-button>

    <!-- Pestaña 3: Redirige al panel de Progreso (gráficas de peso y balances) -->
    <ion-tab-button tab="progreso">
      <ion-icon name="analytics-outline"></ion-icon>
      <ion-label>Progreso</ion-label>
    </ion-tab-button>

    <!-- Pestaña 4: Redirige a la sección de Explorar (catálogo de recetas fitness) -->
    <ion-tab-button tab="recetas">
      <ion-icon name="compass-outline"></ion-icon>
      <ion-label>Explorar</ion-label>
    </ion-tab-button>

    <!-- Pestaña 5: Redirige al Perfil de usuario (cálculo de metabolismo e insignias) -->
    <ion-tab-button tab="perfil">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
